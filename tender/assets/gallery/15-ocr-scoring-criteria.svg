<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1450">
  <rect width="1100" height="1450" fill="#fff"/>
  <text x="70" y="80" font-family="SimSun" font-size="30" font-weight="700" fill="#111827">综合评分办法</text>
  <text x="70" y="115" font-family="SimSun" font-size="18" fill="#4b5563">评标办法：综合评分法，满分 100 分</text>
  <g stroke="#94a3b8">
    <line x1="70" y1="150" x2="1030" y2="150"/><line x1="70" y1="190" x2="1030" y2="190"/><line x1="70" y1="1390" x2="1030" y2="1390"/>
    <line x1="70" y1="150" x2="70" y2="1390"/><line x1="180" y1="150" x2="180" y2="1390"/><line x1="700" y1="150" x2="700" y2="1390"/><line x1="820" y1="150" x2="820" y2="1390"/><line x1="1030" y1="150" x2="1030" y2="1390"/>
  </g>
  <g font-family="SimSun" font-size="15" fill="#111827">
    <text x="85" y="177">序号</text><text x="210" y="177">评分因素</text><text x="720" y="177">分值</text><text x="840" y="177">评分标准</text>
    <text x="85" y="225">1</text><text x="210" y="225">投标报价</text><text x="720" y="225">30</text><text x="840" y="225">以有效最低价为基准价，每高 1% 扣 0.5 分</text>
    <text x="85" y="280">2</text><text x="210" y="280">技术方案</text><text x="720" y="280">25</text><text x="840" y="280">架构完整性、先进性、可扩展性、安全性</text>
    <text x="85" y="335">3</text><text x="210" y="335">产品功能</text><text x="720" y="335">20</text><text x="840" y="335">功能覆盖度、易用性、兼容性、国产化适配</text>
    <text x="85" y="390">4</text><text x="210" y="390">实施方案</text><text x="720" y="390">10</text><text x="840" y="390">进度计划、组织保障、风险控制、验收方案</text>
    <text x="85" y="445">5</text><text x="210" y="445">售后服务</text><text x="720" y="445">8</text><text x="840" y="445">响应时间、驻场人员、培训方案、巡检频次</text>
    <text x="85" y="500">6</text><text x="210" y="500">企业业绩</text><text x="720" y="500">5</text><text x="840" y="500">近三年同类项目合同，每项 1 分，最高 5 分</text>
    <text x="85" y="555">7</text><text x="210" y="555">资质证书</text><text x="720" y="555">2</text><text x="840" y="555">ISO9001、ISO27001、CMMI3 等有效证书</text>
  </g>
  <rect x="70" y="620" width="960" height="680" fill="#f8fafc"/>
  <g font-family="SimSun" font-size="16" fill="#1f2937">
    <text x="100" y="670">详细说明：</text>
    <text x="100" y="710">1. 技术方案中未提供总体架构图、网络拓扑图、安全架构图的，每缺一项扣 2 分。</text>
    <text x="100" y="750">2. 未说明国产化适配路径的，技术方案项最高扣 5 分。</text>
    <text x="100" y="790">3. 产品功能演示须现场完成标书生成、智能审查、图库 OCR 三个核心场景。</text>
    <text x="100" y="830">4. 演示过程中出现系统崩溃、数据丢失、无法恢复错误，产品功能项计 0 分。</text>
    <text x="100" y="870">5. 实施方案缺少里程碑计划的，实施方案项最高扣 3 分。</text>
    <text x="100" y="910">6. 售后服务响应时间超过招标要求的，售后服务项最高扣 4 分。</text>
    <text x="100" y="950">7. 企业业绩须提供合同首页、签字页、验收报告，缺项不计分。</text>
    <text x="100" y="990">8. 资质证书须在有效期内，未提供有效证明文件的不得分。</text>
    <text x="100" y="1030">9. 投标文件存在串标、围标、虚假材料等情形的，按无效投标处理。</text>
    <text x="100" y="1070">10. 评标委员会有权要求投标人对技术参数、业绩和资质进行澄清。</text>
    <text x="100" y="1110">11. 澄清内容不得改变投标文件的实质性响应，否则视为负偏离。</text>
    <text x="100" y="1150">12. 技术部分得分低于满分 60% 的，不再进入商务部分评分。</text>
    <text x="100" y="1190">13. 综合得分相同的，以技术得分高者优先；技术得分仍相同的，报价低者优先。</text>
    <text x="100" y="1230">14. 本评分办法解释权归招标人所有，未尽事宜按相关法律法规执行。</text>
  </g>
  <text x="70" y="1345" font-family="SimSun" font-size="18" fill="#0f172a">合计：100 分</text>
</svg>
