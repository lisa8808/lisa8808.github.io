<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6fafe" />
    <title>图库管理 - AI投标助手</title>
    <link rel="stylesheet" href="./assets/gallery-management.css" />
    <link rel="stylesheet" href="./assets/gallery-detail-inline.css?v=20260911-reseed" />
    <link rel="stylesheet" href="./assets/shared-brand-header.css" />
    <script defer src="./assets/gallery-management.mjs?v=20260911-reseed"></script>
    <script defer src="./assets/gallery-detail-inline.js?v=20260911-reseed"></script>
    <script defer src="./assets/gallery-workbench.js?v=20260911-reseed"></script>
    <script defer src="./assets/shared-brand-header.js?v=20260911-unnamed-project"></script>
    <script defer src="./assets/list-unified-loader.js?v=20260911-owner3"></script>
  </head>
  <body data-page="gallery-workbench">
    <div class="app is-list">
      <header class="topbar">
        <button class="brand" type="button" data-module="标书撰写" aria-label="返回标书撰写列表">
          <span class="brand-content">
            <span class="brand-logo-crop"><img src="./assets/list-huakun-tender-logo-cczIqQ47.png" alt="华鲲元启" /></span>
            <span class="brand-dot">·</span>
            <span class="brand-product">AI投标助手</span>
          </span>
        </button>
        <button class="profile" type="button" data-toast="个人菜单">
          <img class="avatar-image" src="./assets/figma/avatar.svg" alt="" />
          <span>易天行</span>
          <svg class="profile-chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M12.5 6.25 8.25 10.27 4 6.25" /></svg>
        </button>
      </header>

      <main class="list-page gallery-page" aria-label="图库管理工作台">
        <div class="list-surface">
          <div class="list-inner workbench-inner">
            <div class="list-toolbar">
              <nav class="primary-tabs" aria-label="投标业务模块">
                <button class="primary-tab" type="button" data-module="标书撰写">标书撰写</button>
                <button class="primary-tab" type="button" data-module="智能审查">智能审查</button>
                <button class="primary-tab" type="button" data-module="企业信息">企业信息</button>
                <button class="primary-tab active" type="button" aria-current="page">图库管理</button>
              </nav>

            </div>

            <section class="gallery-workbench" aria-label="图库管理">
              <aside class="gallery-sidebar">
                <div class="sidebar-heading">
                  <div><span class="sidebar-eyebrow">图库管理</span><strong>全部图库</strong></div>
                  <span class="sidebar-count" id="sidebarCount">0</span>
                </div>
                <button class="sidebar-create" id="createGalleryButton" type="button">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
                  <span>新建图库</span>
                </button>
                <nav class="gallery-nav" id="galleryNav" aria-label="图库列表"></nav>
              </aside>

              <section class="detail-workspace" aria-label="图片管理区">
          <div class="workspace" id="workspace">
          <section class="gallery-panel" id="galleryPanel">
          <div class="gallery-toolbar">
          <div class="gallery-title-row">
          <h1 class="gallery-name" id="galleryTitle">图库详情</h1>
          <span class="gallery-count" id="galleryCount">0 张</span>
          </div>
          <div class="toolbar-actions">
          <div class="search-box"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><input type="search" placeholder="搜索名称/关键词" id="imgSearch"/></div>
          <div class="view-toggle" title="切换视图">
          <button class="view-btn active" id="gridViewBtn" title="网格视图"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></button>
          <button class="view-btn" id="listViewBtn" title="列表视图"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg></button>
          </div>
          <button class="btn btn-outline" id="focusModeBtn" title="进入焦点预览模式"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 10-2 2 2 2M14 10l2 2-2 2"/></svg>焦点模式</button>
          <button class="btn btn-outline" id="selectAllBtn">全选</button>
          <button class="btn btn-outline" id="batchBtn" disabled>批量删除</button>
          <button class="btn btn-primary" id="uploadBtn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>导入</button>
          </div>
          </div>
          <div class="gallery-scroll">
          <div id="galleryContent"></div>
          <div class="gallery-empty" id="galleryEmpty" hidden>
          <svg viewBox="0 0 24 24"><path d="M4.5 8.5h5l2-2.5h5l2 2.5h1.5a1.5 1.5 0 0 1 1.5 1.5v9a1.5 1.5 0 0 1-1.5 1.5H4.5A1.5 1.5 0 0 1 3 19V10a1.5 1.5 0 0 1 1.5-1.5Z"/><path d="M8 14.5h8"/></svg>
          <strong>暂无图片</strong>
          <p>导入投标相关图片后，AI 将自动识别标题、关键词并生成图片描述。</p>
          <button class="btn btn-primary" id="emptyUploadBtn" type="button">导入图片</button>
          </div>
          </div>
          </section>
          <div class="resize-handle" id="resizeHandle" title="拖拽调整面板宽度"></div>
          <aside class="ai-panel" id="aiPanel">
          <div class="ai-header">
          <div class="ai-title"><span class="ai-title-text">图片解析</span><span class="ai-badge"><svg viewBox="0 0 24 24"><path d="M12 2v4M12 18v4M2 12h4M18 12h4M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/></svg>AI</span></div>
          <div class="ai-header-actions">
          <button class="preview-btn" id="analysisPreviewBtn" title="预览大图"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
          <button class="ai-expand-btn" id="aiToggleBtn" title="收起解析面板"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
          </div>
          </div>
          <div class="ai-content-wrap">
          <div class="ai-group"><div class="ai-label">标题<span class="hint">AI识别 · 可编辑</span></div><input class="ai-input" id="titleInput" placeholder="请输入图片标题"/></div>
          <div class="ai-group"><div class="ai-label">关键词<span class="hint">回车添加 · 点×删除</span></div><div class="kw-box" id="keywordsWrap"><input class="kw-add" placeholder="输入关键词后回车"/></div></div>
          <div class="ai-group"><div class="ai-label">图片描述<span class="hint">AI自动生成</span></div><textarea class="ai-desc" id="descInput" readonly placeholder="AI将自动识别图片内容并生成描述..."></textarea></div>
          </div>
          <div class="ai-footer">
          <button class="f-btn ghost" id="copyBtn"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>复制解析</button>
          <button class="f-btn primary" id="regenBtn"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>重新解析</button>
          </div>
          </aside>
          </div>
              </section>
            </section>
          </div>
        </div>
      </main>
    </div>

    <div class="modal-backdrop" id="createModal" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="createModalTitle">
        <header><h2 id="createModalTitle">新建图库</h2><button class="icon-button" type="button" data-close-modal aria-label="关闭"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></svg></button></header>
        <label class="form-field"><span>图库名称</span><input id="galleryName" type="text" maxlength="30" placeholder="请输入图库名称" /></label>
        <p class="field-error" id="galleryNameError" role="alert"></p>
        <footer><button class="secondary-button" type="button" data-close-modal>取消</button><button class="primary-button" id="confirmCreate" type="button">创建</button></footer>
      </section>
    </div>

    <div class="modal-backdrop" id="deleteModal" hidden>
      <section class="modal confirm-modal" role="alertdialog" aria-modal="true" aria-labelledby="deleteModalTitle">
        <span class="warning-icon"><svg viewBox="0 0 24 24"><path d="M12 8v5M12 17h.01" /><path d="M10.3 4.9 2.8 18a2 2 0 0 0 1.7 3h15a2 2 0 0 0 1.7-3L13.7 4.9a2 2 0 0 0-3.4 0Z" /></svg></span>
        <div><h2 id="deleteModalTitle">删除图库</h2><p id="deleteModalDescription"></p></div>
        <footer><button class="secondary-button" type="button" data-close-delete>取消</button><button class="danger-button" id="confirmDelete" type="button">删除</button></footer>
      </section>
    </div>

    <div class="focus-overlay" id="focusOverlay">
    <div class="focus-topbar">
    <button class="brand" type="button"><img class="brand-logo" src="./assets/list-huakun-tender-logo-cczIqQ47.png" alt="华鲲元启"/><span class="brand-dot">·</span><span class="brand-product">AI投标助手</span><span class="brand-sep"></span><span class="brand-project" id="focusBrandProject">焦点预览模式</span></button>
    <button class="profile" type="button"><img class="avatar-image" src="./assets/figma/avatar.svg" alt=""/><span>易天行</span><svg class="profile-chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M12.5 6.25 8.25 10.27 4 6.25"/></svg></button>
    </div>
    <div class="focus-main">
    <div class="focus-left">
    <div class="focus-toolbar">
    <div class="focus-toolbar-left">
    <button class="focus-exit-btn" id="exitFocusBtn"><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg>返回工作台</button>
    <span class="focus-info" id="focusTitle"></span>
    <span class="focus-counter" id="focusCounter"></span>
    </div>
    </div>
    <div class="focus-stage">
    <button class="stage-nav prev" onclick="fNav(-1)"><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg></button>
    <div class="stage-img" id="focusStage"></div>
    <button class="stage-nav next" onclick="fNav(1)"><svg viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></svg></button>
    <div class="stage-label" id="focusLabel"></div>
    </div>
    <div class="focus-thumbs-wrap">
    <div class="focus-thumbs" id="focusThumbs"></div>
    </div>
    </div>
    <div class="focus-resize" id="focusResizeHandle" title="拖拽调整焦点面板宽度"></div>
    <div class="focus-right" id="focusRight">
    <div class="ai-header">
    <div class="ai-title"><span>图片解析</span><span class="ai-badge">AI 自动识别</span></div>
    <div class="ai-header-actions">
    <button class="ai-expand-btn" id="focusAiToggleBtn" title="收起解析面板"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
    </div>
    </div>
    <div class="ai-content-wrap">
    <div class="ai-group"><div class="ai-label">标题<span class="hint">AI识别</span></div><input class="ai-input" id="fTitle"/></div>
    <div class="ai-group"><div class="ai-label">关键词</div><div class="kw-box" id="fKw"><input class="kw-add" placeholder="输入后回车"/></div></div>
    <div class="ai-group"><div class="ai-label">图片描述<span class="hint">AI生成</span></div><textarea class="ai-desc" id="fDesc" readonly></textarea></div>
    </div>
    <div class="ai-footer">
    <button class="f-btn ghost" id="focusCopyBtn"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>复制</button>
    <button class="f-btn primary" id="focusRegenBtn"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>重新解析</button>
    </div>
    </div>
    </div>
    </div>
    <div class="preview-modal" id="previewModal">
    <button class="preview-close" id="previewCloseBtn" onclick="closePv()"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    <div class="preview-content">
    <div class="image-thumb" id="previewImg"></div>
    <div class="preview-toolbar">
    <button onclick="pvNav(-1)"><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg></button>
    <button id="previewZoomOutBtn" onclick="pvZoom(-.2)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M21 21l-4.3-4.3"/></svg></button>
    <button id="previewZoomInBtn" onclick="pvZoom(.2)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M11 8v6M21 21l-4.3-4.3"/></svg></button>
    <button onclick="pvNav(1)"><svg viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></svg></button>
    </div>
    </div>
    </div>
    <div class="upload-modal" id="uploadModal">
    <div class="upload-dialog">
    <h3>导入图片 <button onclick="closeUpload()"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></h3>
    <div class="upload-dropzone" id="uploadDropzone"><svg viewBox="0 0 24 24"><path d="M12 16V4m0 0L7 9m5-5 5 5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg><p>点击或拖拽图片到此处上传</p><span>支持 jpg / png / gif / bmp / webp，单张不超过 10M</span></div>
    <input id="uploadInput" type="file" accept="image/*" multiple hidden />
    <div class="upload-file-list" id="uploadFileList"></div>
    <p class="upload-error" id="uploadError" role="alert"></p>
    <div class="upload-info"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg><div>上传成功后，系统将自动解析图片内容，提取标题、关键词与描述信息。上传多张时将批量入库。</div></div>
    <footer><button class="btn btn-outline" id="cancelUpload" type="button">取消</button><button class="btn btn-primary" id="confirmUpload" type="button" disabled>确认上传</button></footer>
    </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
