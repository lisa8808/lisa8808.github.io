<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#fff"/>
  <text x="70" y="76" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">智能审查处理流程</text>
  <g font-family="Arial" font-size="16" fill="#334155">
    <rect x="80" y="140" width="180" height="90" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="110" y="180">文件解析</text><text x="110" y="208">PDF / Word / 扫描件</text>
    <rect x="310" y="140" width="180" height="90" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="340" y="180">要素抽取</text><text x="340" y="208">参数 / 条款 / 日期</text>
    <rect x="540" y="140" width="180" height="90" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="570" y="180">规则匹配</text><text x="570" y="208">必答项 / 偏离项</text>
    <rect x="770" y="140" width="180" height="90" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="800" y="180">风险评分</text><text x="800" y="208">高 / 中 / 低风险</text>
    <rect x="1000" y="140" width="120" height="90" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="1020" y="180">报告</text><text x="1020" y="208">一键导出</text>
  </g>
  <g stroke="#025dff" stroke-width="5" fill="none"><path d="M260 185 L310 185"/><path d="M490 185 L540 185"/><path d="M720 185 L770 185"/><path d="M950 185 L1000 185"/></g>
  <g font-family="Arial" font-size="16">
    <rect x="100" y="330" width="240" height="100" rx="18" fill="#fee2e2"/><text x="135" y="370">资质证照审查</text><text x="135" y="398">有效期 / 范围 / 真伪</text>
    <rect x="390" y="330" width="240" height="100" rx="18" fill="#ffedd5"/><text x="425" y="370">商务条款审查</text><text x="425" y="398">报价 / 交付 / 质保</text>
    <rect x="680" y="330" width="240" height="100" rx="18" fill="#dcfce7"/><text x="715" y="370">技术参数审查</text><text x="715" y="398">正偏离 / 负偏离</text>
    <rect x="970" y="330" width="160" height="100" rx="18" fill="#dbeafe"/><text x="1000" y="370">格式审查</text><text x="1000" y="398">目录 / 签章</text>
  </g>
  <rect x="100" y="540" width="1000" height="100" rx="18" fill="#f8fafc"/>
  <text x="140" y="580" font-family="Arial" font-size="18" fill="#0f172a">审查结果：必答项 128 项，已响应 126 项，负偏离 2 项，高风险 1 项</text>
  <text x="140" y="615" font-family="Arial" font-size="16" fill="#64748b">支持审查意见定位到原文页码和段落，并可一键跳转修改。</text>
</svg>
