<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#fff"/>
  <text x="70" y="76" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">项目验收检查表</text>
  <g stroke="#cbd5e1"><line x1="70" y1="130" x2="1130" y2="130"/><line x1="70" y1="170" x2="1130" y2="170"/><line x1="70" y1="650" x2="1130" y2="650"/></g>
  <g font-family="Arial" font-size="17" fill="#475569"><text x="90" y="160">验收项</text><text x="520" y="160">验收标准</text><text x="900" y="160">结论</text></g>
  <g font-family="Arial" font-size="16" fill="#334155">
    <text x="90" y="220">平台安装部署</text><text x="520" y="220">全部节点安装完成并纳入监控</text><text x="900" y="220" fill="#16a34a">通过</text>
    <text x="90" y="280">功能验证</text><text x="520" y="280">43 项功能全部演示通过</text><text x="900" y="280" fill="#16a34a">通过</text>
    <text x="90" y="340">性能压测</text><text x="520" y="340">2000 并发下响应时间≤2 秒</text><text x="900" y="340" fill="#16a34a">通过</text>
    <text x="90" y="400">安全测评</text><text x="520" y="400">高危漏洞全部修复并复测</text><text x="900" y="400" fill="#16a34a">通过</text>
    <text x="90" y="460">数据迁移</text><text x="520" y="460">历史标书 86 万份迁移完成</text><text x="900" y="460" fill="#16a34a">通过</text>
    <text x="90" y="520">培训交付</text><text x="520" y="520">管理员 / 普通用户 / 运维三类培训</text><text x="900" y="520" fill="#16a34a">通过</text>
    <text x="90" y="580">文档交付</text><text x="520" y="580">操作手册、运维手册、验收报告齐套</text><text x="900" y="580" fill="#16a34a">通过</text>
  </g>
  <rect x="70" y="680" width="1060" height="70" rx="14" fill="#f0fdf4"/>
  <text x="100" y="725" font-family="Arial" font-size="19" fill="#166534">验收结论：符合合同要求，同意通过项目验收并进入三年质保期。</text>
